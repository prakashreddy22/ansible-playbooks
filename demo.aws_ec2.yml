plugin: amazon.aws.aws_ec2
ansible_user: ec2-user
ansible_password: DevOPs321
# Specify your target AWS regions
regions:
  - us-east-1

# Only pull instances matching these filters
filters:
  instance-state-name: 'running'
  tag:Name: 'agent-*'

# Define what to use for the Ansible host inventory identifier
hostnames:
  - private-ip-address

# Define what to use for the Ansible host inventory identifier
compose:
  ansible_host: private_ip_address
