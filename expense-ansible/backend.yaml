- name: backend
  hosts: backend
  become: yes
  tasks:
    - name: disable nodejs module
      ansible.builtin.command: "sudo dnf module disable nodejs -y"
    
    - name: enable nodejs module
      ansible.builtin.command: "sudo dnf module enable nodejs:20 -y"
    
    - name: install nodejs
      ansible.builtin.dnf:
        name: nodejs
        state: present

    - name: user creation
      ansible.builtin.user:
        name: expense
        system: yes
      
    - name: create directory
      ansible.builtin.file:
        name: /app
        state: directory
      
      
